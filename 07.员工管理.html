<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>员工管理</title>
  <style>
    /* 重置默认边距 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* 顶栏样式 */
    .header {
      display: flex;
      justify-content: space-between; /* 两端对齐：左侧标题，右侧链接 */
      align-items: center; /* 垂直居中 */
      height: 60px; /* 设置顶栏高度 */
      padding: 0 20px; /* 左右内边距 */
      background-color: #fff; /* 背景色，可根据设计稿调整 */
      border-bottom: 1px solid #e0e0e0; /* 底部边框，增加层次感 */
    }

    /* 左侧标题样式 */
    .header .title {
      font-size: 24px; /* 加大字体 */
      font-weight: bold; /* 加粗 */
      color: #333; /* 字体颜色 */
    }

    /* 右侧退出登录链接样式 */
    .header .logout {
      font-size: 14px;
      color: #666;
      text-decoration: none; /* 去除下划线 */
      cursor: pointer;
    }

    .header .logout:hover {
      color: #ff4d4f; /* 鼠标悬停时变色，提升交互体验 */
    }
  </style>
</head>
<body>
  
  <!-- 第一部分：顶栏 -->
  <div class="header">
    <div class="title">Tlias智能学习辅助系统</div>
    <a href="#" class="logout">退出登录</a>
  </div>

</body>
</html>
